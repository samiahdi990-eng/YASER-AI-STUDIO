name: Build YASER AI STUDIO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download Project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter doctor -v

      - name: Create Android Project
        run: |
          flutter create --platforms=android --project-name yaser_ai_studio temp_app
          cp pubspec.yaml temp_app/pubspec.yaml
          cp -r lib temp_app/lib

      - name: Check Dart Code
        working-directory: temp_app
        run: |
          flutter --version
          dart analyze lib/main.dart

      - name: Install Packages
        working-directory: temp_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: temp_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YASER-AI-STUDIO-APK
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
