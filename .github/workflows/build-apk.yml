name: Build YASER AI STUDIO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create --platforms=android --project-name yaser_ai_studio temp_app
          cp pubspec.yaml temp_app/pubspec.yaml
          cp -r lib temp_app/lib

      - name: Check Dart source
        working-directory: temp_app
        run: |
          grep -nE 'fromSeed|mainAxisAlignment' lib/main.dart
          grep -nE ':[[:space:]]*\.' lib/main.dart || true

      - name: Get packages
        working-directory: temp_app
        run: flutter pub get

      - name: Build APK
        working-directory: temp_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YASER-AI-STUDIO-APK
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
