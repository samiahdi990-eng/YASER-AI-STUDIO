plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.lifechat.app'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        buildConfigField 'int', 'TELEGRAM_API_ID', providers.gradleProperty('TELEGRAM_API_ID').getOrElse('0')
        buildConfigField 'String', 'TELEGRAM_API_HASH', "\"${providers.gradleProperty('TELEGRAM_API_HASH').getOrElse('')}\""
        applicationId 'com.lifechat.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-database'
}
