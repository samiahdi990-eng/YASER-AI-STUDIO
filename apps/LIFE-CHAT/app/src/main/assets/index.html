<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIFE CHAT - Telegram</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;
 justify-content:center;background:#101827;color:white;
 font-family:Arial,sans-serif;padding:20px
}
.panel{
 width:100%;max-width:390px;background:#1c293b;
 border-radius:22px;padding:28px 22px;text-align:center;
 box-shadow:0 12px 35px #0005
}
.logo{font-size:48px;margin-bottom:8px}
h2{margin:8px 0 12px}
p{color:#aebed1;font-size:14px}
input{
 width:100%;padding:15px;margin:9px 0;
 border:1px solid #40516a;border-radius:12px;
 background:#101827;color:white;font-size:16px;text-align:center
}
button{
 width:100%;padding:15px;margin-top:12px;
 border:0;border-radius:12px;background:#229ed9;
 color:white;font-size:16px;font-weight:bold
}
button:active{opacity:.8}
.step{display:none}
#status{margin-top:20px;color:#8ed8ff;line-height:1.8}
</style>
</head>
<body>
<div class="panel">
 <div class="logo">✈️</div>
 <h2>LIFE CHAT</h2>
 <p>ورود و اتصال به تلگرام</p>

 <button id="connect" onclick="telegramStart()">اتصال به تلگرام</button>

 <div id="phoneBox" class="step">
  <input id="phone" type="tel" placeholder="شماره تلفن با کد کشور">
  <button onclick="telegramSendPhone()">ادامه</button>
 </div>

 <div id="codeBox" class="step">
  <input id="code" type="text" placeholder="کد تأیید تلگرام">
  <button onclick="telegramSendCode()">تأیید کد</button>
 </div>

 <div id="passwordBox" class="step">
  <input id="password" type="password" placeholder="رمز دومرحله‌ای">
  <button onclick="telegramSendPassword()">ورود</button>
 </div>

 <div id="status">برای شروع، اتصال به تلگرام را بزنید.</div>
</div>

<script>
function telegramStart(){
 document.getElementById('status').textContent='در حال اتصال...';
 if(window.TelegramBridge) TelegramBridge.start();
 else document.getElementById('status').textContent='پل ارتباطی تلگرام در دسترس نیست.';
}
function telegramSendPhone(){
 const v=document.getElementById('phone').value.trim();
 if(v && window.TelegramBridge) TelegramBridge.sendPhone(v);
}
function telegramSendCode(){
 const v=document.getElementById('code').value.trim();
 if(v && window.TelegramBridge) TelegramBridge.sendCode(v);
}
function telegramSendPassword(){
 const v=document.getElementById('password').value;
 if(v && window.TelegramBridge) TelegramBridge.sendPassword(v);
}
function onTelegramState(data){
 if(typeof data==='string'){try{data=JSON.parse(data)}catch(e){return}}
 const status=document.getElementById('status');
 status.textContent=data.message || data.type || 'وضعیت تلگرام تغییر کرد';
 if(data.type==='wait_phone') document.getElementById('phoneBox').style.display='block';
 if(data.type==='wait_code') document.getElementById('codeBox').style.display='block';
 if(data.type==='wait_password') document.getElementById('passwordBox').style.display='block';
 if(data.type==='ready'){
  document.getElementById('phoneBox').style.display='none';
  document.getElementById('codeBox').style.display='none';
  document.getElementById('passwordBox').style.display='none';
  document.getElementById('connect').style.display='none';
  status.textContent='اتصال به تلگرام موفق شد.';
 }
}
</script>
</body>
</html>
